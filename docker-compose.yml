services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: esmfamil
      POSTGRES_PASSWORD: esmfamil
      POSTGRES_DB: esmfamil
    ports: ["5432:5432"]
    volumes: [esmfamil_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U esmfamil"]
      interval: 3s
      timeout: 3s
      retries: 20
  server:
    build: {context: ., dockerfile: apps/server/Dockerfile}
    env_file: .env
    environment:
      DATABASE_URL: postgresql://esmfamil:esmfamil@db:5432/esmfamil
    ports: ["3001:3001"]
    depends_on:
      db: {condition: service_healthy}
  web:
    build: {context: ., dockerfile: apps/web/Dockerfile}
    ports: ["5173:80"]
    depends_on: [server]
volumes:
  esmfamil_data:
